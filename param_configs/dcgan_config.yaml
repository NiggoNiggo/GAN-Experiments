training:
  name: dcgan
  args:
    out_shape: 64
    channels: 3
    project_name : resnet_sm_orthogonal_attention
    save_path : /mnt/data2/gan_results
    init : orthogonal #orthogonal
    

generator: 
  name: dcgan
  args: 
    out_shape : 64
    latent_dim: 100
    out_channels: 3
    block_type : resnet
    attention_at : [1,2]

discriminator:
  name: dcgan
  args:
    out_shape: 64
    in_channels : 3
    block_type : resnet
    activation : none #Sigmoid  #change bce with bce with logits
    spectral_norm : true
    minibatch_discrimination : false
    attention_at : [1,2]

loss:
  name: hinge
  label_smoothing : false #only useful with normal vanilla loss -> name : vanilla, 
  # feature_matching # add lambda as hyperparameter
  lambda : 5

augmentation:
  args:
    kaka: 

dataset:
  name : general
  # data_path : /mnt/data2/datasets/lsun/train
  data_path : /mnt/data2/datasets/celebA/img_align_celeba

metrics : 
  fid : fid
  prd : prd #precision and recall 

  
params:
  has_labels : false
  batchsize: 128
  num_workers : 10
  latent_dim : 100
  lr_disc: 0.0001
  lr_gen : 0.0002
  logging_iterations : 500
  iterations : 100000
  beta1 : 0.0
  beta2 : 0.99
  n_crit : 5


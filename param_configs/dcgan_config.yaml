training:
  name: dcgan
  args:
    out_shape: 128
    channels: 3
    project_name : test_seed1
    save_path : /mnt/data2/gan_results
    init : orthogonal #orthogonal
    

generator: 
  name: dcgan
  args: 
    out_shape : 128
    latent_dim: 128
    ch_multiplier : 1
    out_channels: 3
    block_type : resnet
    attention_at : [1]
    spectral_norm : true

discriminator:
  name: dcgan
  args:
    out_shape: 128
    in_channels : 3
    ch_multiplier : 1
    block_type : resnet
    activation : none #Sigmoid  #change bce with bce with logits
    spectral_norm : true
    minibatch_discrimination : false
    attention_at : [2] #3#f #o

loss:
  name: feature_matching
  label_smoothing : false #only useful with normal vanilla loss -> name : vanilla, 
  regularizer : fm # extend to use fm as regularizer 

augmentation:
    # RandomHorizontalFlip:  0.01
    RandomRotation : 5
    # ColorJitter :
      # brightness : 0.2
      # hue : 0.05
dataset:
  name : celebA
  # data_path : /mnt/data2/datasets/lsun/train
  data_path : /mnt/data2/datasets/celebAHQ
  return_labels : false

metrics : 
  fid : fid
  prd : prd #precision and recall 

  
params:
  seed : 117 # random seed
  has_labels : false
  batchsize: 128
  num_workers : 10
  latent_dim : 128
  lr_disc: 0.0004
  lr_gen : 0.0002
  logging_iterations : 1000
  iterations : 200000
  beta1 : 0.5
  beta2 : 0.999
  n_crit : 1
  amp : false
# lr scheduler einbauen


